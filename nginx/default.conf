server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 4k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://pbs.twimg.com https://*.twimg.com; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_buffering off;
        proxy_read_timeout 240s;
        proxy_set_header Host $host;
        # Never log access tokens in file-link query strings.
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(js|css)$ { expires 1y; add_header Cache-Control "public, immutable"; }
}
